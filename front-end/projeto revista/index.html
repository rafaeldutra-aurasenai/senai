<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Jovem</title>

    <link rel="stylesheet" href="src/styles/styles.css">
</head>

<body>

   

    <header class="header">

        <h1>Conecta Jovem</h1>

    </header>


    <main class="container">

        <!-- SECTION ESQUERDA -->

        <section class="left">

            <article class="logo-area">

                <h2 class="logo">
                    Conecta <br>
                    Jovem
                </h2>

            </article>

        </section>

        <!-- SECTION DIREITA -->

        <section class="right">

            <article class="form-box">

                <h2 class="title">
                    CADASTRO
                </h2>

                <form id="cadastroForm">

                    <div class="input-group">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Nome completo"
                        >

                    </div>

                    <div class="input-group">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Senha"
                        >

                    </div>

                    <div class="input-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="E-mail"
                        >

                    </div>

                    <div class="input-group">

                        <label for="cargo">
                            Cargo
                        </label>

                        <select id="cargo">

                            <option>Aluno</option>
                            <option>Professor</option>

                        </select>

                    </div>

                    <div class="input-group">

                        <label for="nif">
                            NIF
                        </label>

                        <input
                            type="text"
                            id="nif"
                            placeholder="NIF"
                        >

                    </div>

                    <button type="submit" class="btn">

                        Cadastrar e ir para tela inicial

                    </button>

                </form>

                <p class="cancel">
                    Cancelar cadastro
                </p>

            </article>

        </section>

    </main>

    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 Conecta Jovem
        </p>

    </footer>

    <script src="src/scripts/script.js"></script>

</body>
</html>

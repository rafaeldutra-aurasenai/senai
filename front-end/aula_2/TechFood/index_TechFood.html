<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/index_techfood.css" />
    <title>TechFood - Cardápio Digital</title>
  </head>
  <body>
    <header class="header">
      <div class="logo">TechFood</div>
      <button aria-label="pequisar" class="search-icon">🔍</button>
      <button aria-label="comprar" class="cart-icon">🛒</button>
    </header>

    <div class="banner-hero">
      <h1>Sabor & Saber</h1>
      <p>A melhor gastronomia tecnológica da região.</p>
    </div>

    <main class="menu-container">
        <section class="abas-lista">
            <input type="radio" name="categoria" id="massa" checked />
            <label for="massa">Massas</label>

            <input type="radio" name="categoria" id="bebida" />
            <label for="bebida">Bebidas</label>

            <input type="radio" name="categoria" id="doce" />
            <label for="doce">Doces</label>
        </section>

        <section class="aba-tela" id="tela-massas">
            <div class="grid-produtos">
            <article class="card">
                <img src="src/alexas_fotos-ai-generated-8750450_1920.png"  alt="foto de uma lasanha deliciosa"/>
                <h3>Lasanha Tradicional</h3>
                <p>Massa artesanal ao molho bolonhesa com 4 queijos.</p>
                <span class="preco">R$ 45,90</span>
                <button aria-label="botao de pedir " class="btn-pedir" onclick="alert('Adicionado')">Pedir</button>
            </article>

            <div class="card">
                <img src="src/macarronada-de-carne-moida-blog-monologos-do-arroz.webp" />
                <h3>Ravioli de Espinafre</h3>
                <p>Recheado com ricota fresca e nozes picadas.</p>
                <span class="preco">R$ 39,00</span>
                <button aria-label="botao de fazer o pedido" class="btn-pedir">
                Pedir
                </button>
            </div>
            </div>
        </section>
    </main>

    <div class="rodape">
      <p>Siga-nos: <a href="#">FB</a> <a href="#">IG</a></p>
    </div>
  </body>
</html>
